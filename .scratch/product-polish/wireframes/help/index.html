<!doctype html>
<!-- PROTOTYPE (ticket 06): in-app Help forms and Empty Lane states. ?s=popover|modal|filters|period. Throwaway; mock data, real tokens and fonts. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O Tempora — help prototype</title>
<style>
@font-face{font-family:Archivo;font-weight:400;src:url(../../../../node_modules/@fontsource/archivo/files/archivo-latin-400-normal.woff2)}
@font-face{font-family:Archivo;font-weight:500;src:url(../../../../node_modules/@fontsource/archivo/files/archivo-latin-500-normal.woff2)}
@font-face{font-family:Archivo;font-weight:600;src:url(../../../../node_modules/@fontsource/archivo/files/archivo-latin-600-normal.woff2)}
@font-face{font-family:Archivo;font-weight:700;src:url(../../../../node_modules/@fontsource/archivo/files/archivo-latin-700-normal.woff2)}
@font-face{font-family:Fraunces;font-weight:600;src:url(../../../../node_modules/@fontsource/fraunces/files/fraunces-latin-600-normal.woff2)}
@font-face{font-family:Fraunces;font-weight:900;src:url(../../../../node_modules/@fontsource/fraunces/files/fraunces-latin-900-normal.woff2)}
:root{
  --bg:#F2E9D2;--surface:#FBF6E9;--raised:#FFF;--border:#E0D3AC;--border-strong:#C7B383;--control:#837757;
  --ink:#241A10;--ink2:#6B6046;--accent:#8A2A1A;--focus:#6E2013;--axis:#EBDDBD;--conflict:#8C2D2B;--sci:#008255;--soc:#946513;
  --sports:#9A5C73;--biz:#347830;--hum:#4E4993;--inst:#B6514C;--exp:#3E70B0;--arts:#A85A3D;--tech:#357B5C;--pub:#8E672C;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:400 14px/1.45 Archivo,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;flex-direction:column;height:100%}

/* top bar */
.top{display:flex;align-items:center;gap:14px;height:56px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border-strong);flex:none;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font:900 19px Fraunces,serif}
.brand i{width:24px;height:24px;border-radius:50%;background:var(--accent);display:inline-block}
.search{flex:0 1 240px;height:34px;border:1px solid var(--control);border-radius:9999px;background:var(--raised);padding:0 14px;color:var(--ink2);display:flex;align-items:center}
.seg{display:flex;align-items:center;gap:8px;margin-left:auto}
.seg label{font-size:12px;color:var(--ink2);font-weight:600}
.seg .row{display:flex;border:1px solid var(--control);border-radius:9999px;overflow:hidden;background:var(--raised)}
.seg .row span{padding:6px 12px;font-size:13px;border-left:1px solid var(--border)}
.seg .row span:first-child{border-left:0}
.seg .row span.on{background:var(--ink);color:var(--bg)}
.btn{height:34px;border:1px solid var(--control);border-radius:9999px;background:var(--raised);padding:0 14px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.help{width:34px;padding:0;justify-content:center;font:600 16px Archivo}
.help.open{background:var(--ink);color:var(--bg)}
.vr{font:600 22px Fraunces,serif;position:absolute;left:50%;transform:translateX(-50%);top:62px;z-index:1;pointer-events:none}

.filterbar{display:flex;gap:8px;align-items:center;padding:7px 16px;background:var(--surface);border-bottom:1px solid var(--border);font-size:13px;flex:none}
.filterbar b{font-weight:600;color:var(--ink2);font-size:12px}
.fchip{border:1px solid var(--control);border-radius:9999px;padding:2px 10px;background:var(--raised)}
.filterbar a{margin-left:auto;color:var(--accent);font-weight:600;text-decoration:underline}

/* stage */
.stage{flex:1;display:flex;min-height:0;position:relative}
.gutter{width:206px;flex:none;background:var(--surface);border-right:1px solid var(--border-strong);display:flex;flex-direction:column}
.g{padding:12px 12px 8px}
.g h3{font:600 14px Archivo}
.g p{font-size:12px;color:var(--ink2);margin:2px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--control);border-radius:9999px;padding:2px 8px;font-size:12px;background:var(--raised)}
.chip i{width:8px;height:8px;border-radius:50%}
.chip.sel{background:#EFE4C8;font-weight:600}
.chip.sel::after{content:"✓";font-size:11px}
.axisg{height:34px;flex:none;background:var(--axis);border-top:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong)}
.canvas{flex:1;position:relative;min-width:0;display:flex;flex-direction:column}
.lane{position:relative;overflow:hidden}
.lane.p{flex:1}
.lane.c{flex:.8}
.axis{height:34px;flex:none;background:var(--axis);border-top:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong);position:relative}
.axis span{position:absolute;top:8px;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;transform:translateX(-50%)}
svg.m{position:absolute;inset:0;width:100%;height:100%}
svg.m text{font:400 11.5px Archivo,sans-serif;fill:var(--ink)}

/* phone-only bits */
.phonebar{display:none}
.lanetag{display:none}

/* empty lane */
.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;padding:14px 20px;max-width:340px;box-shadow:0 10px 24px -16px rgba(36,26,16,.5)}
.empty b{display:block;font-weight:600;font-size:15px}
.empty p{color:var(--ink2);font-size:13px;margin-top:2px}
.empty .btn{margin-top:10px;height:32px}

/* popover */
.scrim{position:absolute;inset:0;background:rgba(36,26,16,.28);z-index:8}
.pop{position:absolute;z-index:9;background:var(--surface);border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 18px 40px -16px rgba(36,26,16,.55)}
.pop.desk{top:62px;right:16px;width:380px;padding:18px 18px 12px}
.pop::before{content:"";position:absolute;top:-7px;right:20px;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--border-strong);border-top:1px solid var(--border-strong);transform:rotate(45deg)}
.pop h2{font:600 20px Fraunces,serif;margin-bottom:10px}
.pt{display:flex;gap:11px;margin-bottom:11px}
.pt .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--bg);font:700 12px/24px Archivo;text-align:center}
.pt b{display:block;font-weight:600;font-size:14px;line-height:1.3}
.pt span{color:var(--ink2);font-size:13px}
.key{border-top:1px solid var(--border);padding-top:10px;margin-top:2px;font-size:12.5px;color:var(--ink2);display:grid;gap:5px}
.key .sw{display:inline-block;vertical-align:middle;margin-right:6px}
.key b{color:var(--ink);font-weight:600}
.foot{border-top:1px solid var(--border);margin-top:12px;padding-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.foot a{font-weight:600;text-decoration:underline}
.foot .lang b{font-weight:700}
.foot .lang a{margin-left:8px;color:var(--ink2);font-weight:500}

/* about modal */
.modal{position:absolute;z-index:9;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;max-height:calc(100% - 48px);overflow:hidden;background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;box-shadow:0 24px 50px -18px rgba(36,26,16,.6);padding:22px 24px}
.modal h2{font:600 24px Fraunces,serif}
.modal h3{font:600 12px Archivo;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:16px 0 6px}
.modal p{font-size:13.5px;color:var(--ink2);margin-top:4px}
.modal .x{position:absolute;right:14px;top:12px;width:30px;height:30px;border:1px solid var(--control);border-radius:50%;background:var(--raised);line-height:26px;text-align:center}
.modal .pt{margin-bottom:9px}
.modal hr{border:0;border-top:1px solid var(--border);margin:14px 0 0}

/* ---------- phone ---------- */
@media (max-width:640px){
  .top{height:52px;padding:0 12px;gap:10px}
  .top .search,.top .seg,.top .btn.region{display:none}
  .top .help{margin-left:auto}
  .phonebar{display:block;background:var(--surface);border-bottom:1px solid var(--border-strong);padding:8px 12px;flex:none}
  .phonebar .row{display:flex;border:1px solid var(--control);border-radius:9999px;overflow:hidden;background:var(--raised)}
  .phonebar .row span{flex:1;text-align:center;padding:6px 0;font-size:12.5px;border-left:1px solid var(--border)}
  .phonebar .row span:first-child{border-left:0}
  .phonebar .row span.on{background:var(--ink);color:var(--bg)}
  .phonebar .lbl{font-size:11.5px;color:var(--ink2);margin-bottom:4px;font-weight:600}
  .phonebar .btns{display:flex;gap:8px;margin-top:8px}
  .gutter{display:none}
  .stage{flex-direction:column}
  .lanetag{display:inline-flex;position:absolute;left:10px;top:8px;z-index:3;background:var(--surface);border:1px solid var(--control);border-radius:9999px;padding:2px 10px;font-size:12px;font-weight:600;gap:4px}
  .vr{top:120px;left:auto;right:12px;transform:none;font-size:18px}
  .pop.desk{display:none}
  .sheet{position:absolute;z-index:9;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border-strong);border-radius:16px 16px 0 0;padding:10px 18px 16px;box-shadow:0 -18px 40px -16px rgba(36,26,16,.55)}
  .sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--border-strong);margin:0 auto 12px}
  .sheet h2{font:600 20px Fraunces,serif;margin-bottom:10px}
  .modal{width:calc(100% - 24px);padding:18px 16px;max-height:calc(100% - 40px)}
  .empty{max-width:280px}
  .filterbar{flex-wrap:wrap;padding:6px 12px}
}
@media (min-width:641px){.sheet{display:none}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
const s = new URLSearchParams(location.search).get('s') || 'popover';
const phone = innerWidth <= 640;
const st = {
  popover: {help: true, form: 'pop'},
  modal: {help: true, form: 'modal'},
  filters: {filters: true},
  period: {period: true},
}[s];

const hint = '<b>Detail Level</b> — how much to show, most famous first.';
const points = `
  <div class="pt"><span class="n">1</span><div><b>Time runs left to right.</b><span>Drag to travel, pinch or scroll to zoom.</span></div></div>
  <div class="pt"><span class="n">2</span><div><b>Lives, conflicts and milestones share one timeline.</b><span>A bar is a life or a conflict, a dot is a single moment.</span></div></div>
  <div class="pt"><span class="n">3</span><div><b>Tap anything for the story.</b><span>Begin with the famous, then dig deeper.</span></div></div>`;
const keyInner = `
  <div>${hint}</div>
  <div><span class="sw"><svg width="38" height="8"><rect x="0" y="2" width="12" height="4" rx="2" fill="${'#4E4993'}"/><rect x="14" y="2" width="12" height="4" rx="2" fill="#357B5C"/><rect x="28" y="2" width="10" height="4" rx="2" fill="#A85A3D"/></svg></span>Colour shows a person's field or a milestone's kind. <b>Conflicts are always red.</b></div>`;
const key = `<div class="key">${keyInner}</div>`;
const footer = `<div class="foot"><a href="#">About &amp; data</a><span class="lang"><b>English</b><a href="#">Русский</a></span></div>`;

const popover = `
  <div class="scrim"></div>
  <div class="pop desk"><h2>How to read this timeline</h2>${points}${key}${footer}</div>
  <div class="sheet"><h2>How to read this timeline</h2>${points}${key}${footer}</div>`;

const aboutModal = `
  <div class="scrim"></div>
  <div class="modal"><button class="x">×</button>
    <h2>About O Tempora</h2>
    <h3>How to read this timeline</h3>${points}
    ${key}
    <hr>
    <h3>About</h3>
    <p>O Tempora is a read-only, continuously zoomable visualization of world history — People, Conflicts, and Milestones, spanning ~800 BCE to the present. Made by Sergei Kartin.</p>
    <h3>Data &amp; attribution</h3>
    <p>People: Pantheon 2.0 (CC BY-SA 4.0), Wikidata (CC0). Conflicts and Milestones: Wikidata (CC0).</p>
    <h3>Code &amp; feedback</h3>
    <p>Open source (MIT) · View source on GitHub → · Report a problem or suggest an entry →</p>
    <div class="foot" style="margin-top:12px"><span></span><span class="lang"><b>English</b><a href="#">Русский</a></span></div>
  </div>`;

function marks(kind, w, h, o) {
  // deterministic mock marks: [x0, x1|null, row, colour, label]
  const out = [];
  const rowH = 24, top = kind === 'p' ? h - 20 : (innerWidth <= 640 ? 44 : 18);
  o.forEach(([a, b, r, c, t]) => {
    const y = kind === 'p' ? top - r * rowH : top + r * rowH;
    const x0 = a * w, x1 = (b ?? a) * w;
    if (b == null) out.push(`<circle cx="${x0}" cy="${y}" r="5" fill="${c}" opacity=".8"/><text x="${x0 + 9}" y="${y + 4}">${t}</text>`);
    else out.push(`<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="${c}" stroke-width="5" stroke-linecap="round" opacity=".8"/><text x="${x0}" y="${kind === 'p' ? y - 9 : y + 17}">${t}</text>`);
  });
  return out.join('');
}

const peopleMarks = [
  [.04, .30, 0, '#4E4993', 'Immanuel Kant'], [.16, .40, 1, '#357B5C', 'Antoine Lavoisier'], [.28, .46, 2, '#A85A3D', 'W. A. Mozart'],
  [.42, .66, 0, '#B6514C', 'Napoleon'], [.52, .80, 1, '#4E4993', 'Hegel'], [.62, .88, 2, '#A85A3D', 'Beethoven'], [.74, .96, 0, '#357B5C', 'Faraday'],
];
const confMarks = [
  [.10, .22, 0, '#8C2D2B', 'Seven Years’ War'], [.26, null, 1, '#008255', 'Smallpox vaccine'], [.34, .52, 0, '#8C2D2B', 'French Revolution'],
  [.58, null, 1, '#946513', 'Steam locomotive'], [.64, .86, 0, '#8C2D2B', 'Napoleonic Wars'],
];
const periodConf = [[.22, .58, 0, '#8C2D2B', 'Trojan War (traditional)'], [.70, null, 1, '#946513', 'Bronze Age collapse']];

function axisLabels(labels) {
  return labels.map(([f, t]) => `<span style="left:${f * 100}%">${t}</span>`).join('');
}

const okFilters = st.filters;
const range = st.period ? '1100 – 1000 BCE' : '1750 – 1850';
const axis = st.period ? [[.1, '1090 BCE'], [.3, '1070'], [.5, '1050'], [.7, '1030'], [.9, '1010']] : [[.1, '1760'], [.3, '1780'], [.5, '1800'], [.7, '1820'], [.9, '1840']];
const levelOn = st.period ? 1 : 1; // Mainstream

const chipsP = [['Sports', '#9A5C73'], ['Business & Law', '#347830'], ['Humanities', '#4E4993'], ['Politics & Religion', '#B6514C'], ['Exploration', '#3E70B0'], ['Arts', '#A85A3D'], ['Science & Tech', '#357B5C'], ['Public Figures', '#8E672C']];
const selP = okFilters ? ['Sports'] : [];
const chipP = chipsP.map(([n, c]) => `<span class="chip${selP.includes(n) ? ' sel' : ''}" style="${selP.includes(n) ? 'border-color:' + c : ''}"><i style="background:${c}"></i>${n}</span>`).join('');
const chipC = [['Conflicts', '#8C2D2B'], ['Science & Innovation', '#008255'], ['Society & Culture', '#946513']].map(([n, c]) => `<span class="chip"><i style="background:${c}"></i>${n}</span>`).join('');

const levels = ['Legendary', 'Mainstream', 'Specialized', 'Deep Cut'];
const seg = `<div class="row">${levels.map((l, i) => `<span class="${i === levelOn ? 'on' : ''}">${l}</span>`).join('')}</div>`;

const peopleEmpty = st.filters
  ? `<div class="empty"><b>Nothing matches these filters</b><p>Sports in Polynesia has no people in this period.</p><button class="btn">Clear all filters</button></div>`
  : st.period
    ? `<div class="empty"><b>Nothing at this Detail Level in this period</b><p>Fewer people are recorded this early.</p><button class="btn">Show more · Specialized</button></div>`
    : '';

const confData = st.period ? periodConf : confMarks;
const peopleData = (st.filters || st.period) ? [] : peopleMarks;
const confShown = st.filters ? confMarks.slice(1, 3) : confData;

document.getElementById('app').innerHTML = `
  <div class="top">
    <div class="brand"><i></i>O Tempora</div>
    <div class="search">Search people, conflicts, milestones…</div>
    <div class="seg"><label>Show</label>${seg}</div>
    <button class="btn region ${st.filters ? 'solid' : ''}">Region${st.filters ? ' · 1' : ''} ▾</button>
    <button class="btn help ${st.help ? 'open' : ''}" aria-label="Help">?</button>
  </div>
  <div class="phonebar"><div class="lbl">Show · how much, most famous first</div><div class="row">${levels.map((l, i) => `<span class="${i === levelOn ? 'on' : ''}">${l}</span>`).join('')}</div>
    <div class="btns"><button class="btn region ${st.filters ? 'solid' : ''}" style="display:inline-flex">Region${st.filters ? ' · 1' : ''} ▾</button></div></div>
  ${st.filters ? `<div class="filterbar"><b>Showing only</b><span class="fchip">Sports ×</span><span class="fchip">Polynesia ×</span><a href="#">Clear all</a></div>` : ''}
  <div class="vr">${range}</div>
  <div class="stage">
    <div class="gutter">
      <div class="g" style="flex:1"><h3>People</h3><p>Who lived when. Click a field to show only it.</p><div class="chips">${chipP}</div></div>
      <div class="axisg"></div>
      <div class="g" style="flex:.8"><h3>Conflicts &amp; Milestones</h3><p>Bars last years. Dots are moments.</p><div class="chips">${chipC}</div></div>
    </div>
    <div class="canvas">
      <div class="lane p" id="lp"><span class="lanetag">People ▾</span>${peopleEmpty}</div>
      <div class="axis">${axisLabels(axis)}</div>
      <div class="lane c" id="lc"><span class="lanetag">Conflicts &amp; Milestones ▾</span></div>
    </div>
    ${s === 'popover' ? popover : ''}
    ${s === 'modal' ? aboutModal : ''}
  </div>`;

for (const [id, kind, data] of [['lp', 'p', peopleData], ['lc', 'c', confShown]]) {
  const el = document.getElementById(id), r = el.getBoundingClientRect();
  const svg = `<svg class="m" viewBox="0 0 ${r.width} ${r.height}" preserveAspectRatio="none">${marks(kind, r.width, r.height, data)}</svg>`;
  el.insertAdjacentHTML('afterbegin', svg);
}
</script>
</body>
</html>
